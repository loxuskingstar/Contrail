# Construit les installeurs de bureau (Windows .exe, macOS .dmg, Linux .deb + .tar.gz).
# Déclenchement : à la main (Actions > « Installeurs de bureau » > Run workflow) ou en poussant un tag « v2.2.0 » (publie une Release).
name: Installeurs de bureau

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos-arm }      # Apple Silicon (M1 et suivants)
          - { os: macos-15-intel, name: macos-intel }  # Mac Intel
          - { os: ubuntu-22.04, name: linux }          # glibc ancienne : tourne aussi sur les distributions récentes
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dépendances
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller pystray
      - name: Tests (Linux seulement)
        # Un test capricieux sous Windows ou macOS ne doit pas bloquer les installeurs
        if: runner.os == 'Linux'
        shell: bash
        env: { CONTRAIL_OFFLINE: "1" }
        run: python -m pytest -q
      - name: Version
        shell: bash
        run: echo "VERSION=$(python -c 'from app.core import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_ENV"
      - name: Application autonome (PyInstaller)
        shell: bash
        run: pyinstaller --noconfirm desktop/contrail.spec
      - name: Test de démarrage de l'application figée
        shell: bash
        run: |
          case "$RUNNER_OS" in Windows) EXE=dist/Contrail/Contrail.exe ;; macOS) EXE=dist/Contrail.app/Contents/MacOS/Contrail ;; *) EXE=dist/Contrail/Contrail ;; esac
          CONTRAIL_OFFLINE=1 "$EXE" --data-dir "$RUNNER_TEMP/contrail-data" --no-browser --no-tray --port 8799 > "$RUNNER_TEMP/out.txt" 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8799/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/api/health || { cat "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/contrail-data/contrail.log" || true; exit 1; }
          "$EXE" --data-dir "$RUNNER_TEMP/contrail-data" --stop --no-browser || true
      - name: Installeur Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress; $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\Contrail" desktop\windows\contrail.iss
      - name: Image disque macOS
        if: runner.os == 'macOS'
        run: bash desktop/macos/build_dmg.sh "$VERSION"
      - name: Paquets Linux
        if: runner.os == 'Linux'
        run: bash desktop/linux/build_linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: contrail-${{ matrix.name }}
          path: |
            dist/*-Setup.exe
            dist/*.dmg
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/*, generate_release_notes: true }
