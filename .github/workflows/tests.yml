# Contrôles à chaque envoi : tests de l'API, contrôle statique du front, test de fumée dans un navigateur.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dépendances
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt playwright
          playwright install --with-deps chromium
      - name: API
        env: { CONTRAIL_OFFLINE: "1" }
        run: python -m pytest -q
      - name: Front (icônes, i18n, classes)
        run: python scripts/lint_front.py
      - name: Navigateur (pages principales)
        run: python tests/e2e_smoke.py
