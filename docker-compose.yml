services:
  contrail:
    build: .
    image: contrail:latest
    container_name: contrail
    restart: unless-stopped
    ports:
      - "${CONTRAIL_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Propriétaire des fichiers créés dans ./data (sortie de `id -u` et `id -g` sur l'hôte)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # Tout l'état de l'application (BDD, photos, audio, sauvegardes, config) vit ici.
      - ./data:/app/data
